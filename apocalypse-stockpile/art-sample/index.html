<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263e35"><link rel="icon" href="data:,"><title>美术样板 · 我在末日前囤物资</title><link rel="stylesheet" href="assets/sample.css?v=1"></head><body>
<header><a href="../" aria-label="返回原游戏" class="back">‹</a><div><span>我在末日前囤物资</span><h1>一架安心的储备</h1></div><button id="compare" aria-pressed="false">风格对照</button></header>
<main><section id="stage" aria-label="可以旋转缩放和试摆的真实3D游戏样板"><div id="loading"><span class="loading-dot"></span><p>正在打开新模型与材质…</p></div><div class="stage-label"><span id="scene-label">实机3D样板</span><b id="focus-name">橡木与森林绿钢架</b></div><div class="views"><button id="close-view" class="active">近看</button><button id="whole-view">全架</button><button id="item-view">单件</button><button id="night" aria-pressed="true">暖灯</button></div><p id="gesture-note">单指旋转 · 双指移动和缩放</p><div id="toast" role="status"></div></section>
<aside id="reference" hidden><div class="reference-heading"><h2>你确认过的风格图</h2><button id="close-reference" aria-label="关闭参考图">×</button></div><img id="reference-image" alt="已确认的物资、储物家具与仓库空间美术总览图"><p>左侧为当前可以操作的3D样板；这张图用于对照造型、材质与光影。</p></aside>
</main>
<section id="supply-panel"><div class="panel-heading"><div><span id="asset-count">1座货架 · 8种物资</span><h2 id="selected-name">矿泉水</h2></div><div class="actions"><button id="inspect-mode" class="active">看细节</button><button id="stock-mode">试摆</button><button id="undo" aria-label="撤销上次摆放">↶</button></div></div><nav id="items" aria-label="选择要查看或摆放的物资"></nav><p class="panel-note" id="panel-note">先看这一组的质感，再决定是否扩展整套物资。</p></section>
<script src="assets/sample.js?v=1"></script></body></html>
