<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f6efd9"><meta name="color-scheme" content="light"><meta name="description" content="一座空白纸岛，四季风景由你亲手剪绘。"><title>孤岛绘境 · 剪一片自己的风景</title><link rel="stylesheet" href="style.css"></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="paper-edge" x="-8%" y="-8%" width="116%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<header><div class="brand"><h1><img src="assets/title.png" alt="孤岛绘境"></h1><p>划过纸面，长出风景</p></div><span class="save-state" id="saveState" role="status">正在打开小岛…</span><button id="islands" class="paper-btn"><span class="save-folder" aria-hidden="true"></span><span id="islandName">存档</span></button><button id="help" class="round-btn" aria-label="操作说明">?</button></header>
<main id="gameArea"><canvas id="scene" aria-label="三维岛屿画布，单指造景，双指平移缩放并扭转视角"></canvas>
<div id="loading" role="status"><div class="loading-island">✦</div><strong>正在铺开纸上的小岛</strong><p>风景从留白开始。</p></div>
<aside class="palette" id="palette" aria-label="造景笔刷库"><label class="category-label" for="categorySelect">笔刷</label><select id="categorySelect" aria-label="笔刷分类"></select><div id="brushes" role="group" aria-label="选择笔刷"></div><div class="brush-settings"><label for="size">笔刷大小 <span id="sizeLabel">55</span></label><input type="range" id="size" min="20" max="170" value="55" aria-label="笔刷大小"><label for="density">景物疏密 <span id="densityLabel">适中</span></label><input type="range" id="density" min="15" max="400" value="100" aria-label="笔刷疏密"></div></aside>
<button id="paletteToggle" aria-controls="palette" aria-expanded="true" title="收起笔刷栏"><span>‹</span><small>收起</small></button>
<div class="random-tools"><button id="randomBuild" class="paper-btn" title="随机生成一座完整景观，可撤销">✦ 随机建一个</button><button id="randomStyles" class="paper-btn" aria-label="选择造景主题">⌄</button></div><div class="atmosphere"><button id="time" class="paper-btn">◷ <span>日光</span></button><button id="sound" class="paper-btn" aria-label="轻柔音乐设置">♫</button><button id="expand" class="paper-btn" title="拓建岛屿">⤢ <span>拓建</span></button></div>
<div id="selectionPanel" class="selection-panel" hidden><strong id="selectionName">调整朝向</strong><button id="selectionDone">完成</button><div><button id="turnLeft" aria-label="逆时针旋转15度">↶</button><input id="objectAngle" type="range" min="0" max="359" step="1" value="0" aria-label="物件朝向"><button id="turnRight" aria-label="顺时针旋转15度">↷</button><span id="objectAngleLabel">0°</span></div></div>

<div class="camera-controls"><div class="orbit"><button id="orbitLeft" aria-label="向左旋转视角">↶</button><button id="tilt" title="切换俯视角度">俯仰</button><button id="rotateMode" aria-label="单指旋转视角" aria-pressed="false">旋转</button><button id="orbitRight" aria-label="向右旋转视角">↷</button></div><div class="zoom"><button id="minus" aria-label="缩小">−</button><span id="zoomValue">100%</span><button id="plus" aria-label="放大">＋</button><button id="fit" title="查看全岛" aria-label="查看全岛">⌖</button></div></div>
<div class="bottom-area"><div class="current-brush"><span id="brushIcon"></span><div><strong id="brushName">小雏菊</strong></div></div><div class="toolbar"><button id="paint" class="selected">✎ <span>画笔</span></button><button id="pan">✥ <span>漫游</span></button><button id="edit">⟳ <span>调整</span></button><button id="undo">↶ <span>撤销</span></button><button id="redo" aria-label="重做">↷</button><button id="erase">◇ <span>擦除</span></button><button id="capture" class="accent">✧ <span>保存</span></button></div></div>
<div class="toast" id="toast" role="status"></div>
</main><footer><button id="clear">重新留白</button></footer><dialog id="modal"><button class="close-modal" aria-label="关闭">×</button><div id="modalContent"></div></dialog>
<script src="core.js"></script><script type="module" src="game.js"></script></body></html>
